<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<main class="game-container">
    <h1>Jogo da Velha</h1>
    <div class="info-panel">
        <div class="turn-indicator">
            Vez do jogador: <span id="current-player" class="player-x">X</span>
        </div>

        <div class="score-board">
            <div class="score-card player-x-card">
                <span class="player-label">Jogador X</span>
                <span id="score-x" class="score-value">0</span>
            </div>

            <div class="score-card player-o-card">
                <span class="player-label">Jogador O</span>
                <span id="score-o" class="score-value">0</span>
            </div>
        </div>
    </div>

    <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>
    <button id="restart-btn" class="restart-btn">Reiniciar Partida</button>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="script.js"></script>


</body>
</html>
